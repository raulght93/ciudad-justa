<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:26px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:999px}
  .tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border:1px solid}
</style>
</head>
<body class="cj">
  <div class="row">
    <span class="pill" style="color:#2fe08a;background:#2fe08a1a;border:1px solid #2fe08a44"><span class="dot" style="background:#2fe08a"></span>Confirmado</span>
    <span class="pill" style="color:#ffe000;background:#ffe0001a;border:1px solid #ffe00044"><span class="dot" style="background:#ffe000"></span>En revisión</span>
    <span class="pill" style="color:#ff6a48;background:#ff3b121a;border:1px solid #ff3b1244"><span class="dot" style="background:#ff3b12"></span>Sin verificar</span>
    <span class="pill" style="color:#00e5ff;background:#00e5ff1a;border:1px solid #00e5ff44"><span class="dot" style="background:#00e5ff"></span>En discusión</span>
  </div>
  <div class="row">
    <span class="tag" style="color:#ff6a48;border-color:#ff3b1255">ANTITUMBADO</span>
    <span class="tag" style="color:#ff6a48;border-color:#ff3b1255">PINCHOS</span>
    <span class="tag" style="color:#ff6a48;border-color:#ff3b1255">AMENIDAD FANTASMA</span>
    <span class="tag" style="color:#b084ff;border-color:#b084ff55">PRÓXIMA CAPA</span>
  </div>
</body>
</html>
