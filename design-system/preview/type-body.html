<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:24px;box-sizing:border-box}
  .specimen{font-family:var(--grotesk);color:var(--fg-1)}
  .w4{font-weight:400}.w5{font-weight:500}.w7{font-weight:700}
  .line{font-size:21px;line-height:1.45;margin-bottom:4px}
  .body{font-size:15px;line-height:1.6;color:var(--fg-2);max-width:60ch;margin-top:14px}
  .meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--fg-3);margin-top:16px}
</style>
</head>
<body class="cj">
  <div class="specimen">
    <div class="line w4">Space Grotesk · Regular 400</div>
    <div class="line w5">Space Grotesk · Medium 500</div>
    <div class="line w7">Space Grotesk · Bold 700</div>
    <p class="body">El espacio público se diseña para expulsar en lugar de acoger. Lo cartografiamos, lo votamos y lo sacamos a la luz. Cuerpo de texto y UI a 17px, interlineado 1.6.</p>
    <div class="meta">SPACE GROTESK · BODY + UI · 400 / 500 / 600 / 700</div>
  </div>
</body>
</html>
