<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:0;box-sizing:border-box;display:flex}
  .cell{flex:1;position:relative;overflow:hidden;padding:24px;box-sizing:border-box;min-height:150px;display:flex;flex-direction:column;justify-content:center}
  .cell + .cell{border-left:1px solid var(--line)}
  .big{font-family:var(--display);font-size:52px;text-transform:uppercase;line-height:.84;color:var(--fg-1);position:relative;z-index:1}
  .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--fg-3);text-transform:uppercase;position:relative;z-index:1;margin-top:14px}
</style>
</head>
<body class="cj">
  <div class="cell riso-grain">
    <div class="big">Grano</div>
    <div class="lab">riso-grain · overlay fractal-noise</div>
  </div>
  <div class="cell">
    <div class="big offset-print">No estés</div>
    <div class="lab">offset-print · misregistro cian/rojo</div>
  </div>
</body>
</html>
