<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:22px;box-sizing:border-box}
  .grid{display:flex;gap:0;border:1px solid var(--line)}
  .sw{flex:1;height:108px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box}
  .name{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em}
  .hex{font-family:var(--mono);font-size:10px;letter-spacing:.04em;opacity:.7;margin-top:2px}
</style>
</head>
<body class="cj">
  <div class="grid">
    <div class="sw" style="background:#0a0a0b"><span class="name" style="color:#f4f1ea">ink-900</span><span class="hex" style="color:#f4f1ea">#0A0A0B · page</span></div>
    <div class="sw" style="background:#0f0f11"><span class="name" style="color:#f4f1ea">ink-850</span><span class="hex" style="color:#f4f1ea">#0F0F11 · alt</span></div>
    <div class="sw" style="background:#141416"><span class="name" style="color:#f4f1ea">ink-800</span><span class="hex" style="color:#f4f1ea">#141416 · panel</span></div>
    <div class="sw" style="background:#1a1a1d"><span class="name" style="color:#f4f1ea">ink-700</span><span class="hex" style="color:#f4f1ea">#1A1A1D · card</span></div>
    <div class="sw" style="background:#232327"><span class="name" style="color:#f4f1ea">ink-600</span><span class="hex" style="color:#f4f1ea">#232327 · hover</span></div>
    <div class="sw" style="background:#2e2e33"><span class="name" style="color:#f4f1ea">ink-500</span><span class="hex" style="color:#f4f1ea">#2E2E33 · line</span></div>
  </div>
</body>
</html>
