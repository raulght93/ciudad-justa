<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:30px;box-sizing:border-box;display:flex;gap:34px;align-items:center}
  .block{background:var(--ink-700);border:2px solid var(--fg-1);padding:18px 20px;width:150px}
  .t{font-family:var(--grotesk);font-weight:700;font-size:15px;color:var(--fg-1)}
  .s{font-family:var(--mono);font-size:10px;color:var(--fg-3);margin-top:6px}
  .b1{box-shadow:6px 6px 0 0 var(--signal-red)}
  .b2{box-shadow:6px 6px 0 0 var(--signal-yellow)}
  .b3{border-color:var(--line-strong);box-shadow:none}
  .note{font-family:var(--grotesk);font-size:13px;color:var(--fg-3);max-width:24ch;line-height:1.55}
</style>
</head>
<body class="cj">
  <div class="block b1"><div class="t">Hard offset</div><div class="s">6 6 0 · red</div></div>
  <div class="block b2"><div class="t">Hard offset</div><div class="s">6 6 0 · yellow</div></div>
  <div class="block b3"><div class="t">Flat / inset</div><div class="s">1px hairline</div></div>
  <p class="note">Sin sombra difusa. La elevación es un desplazamiento sólido de tinta — gesto de cartel serigrafiado.</p>
</body>
</html>
