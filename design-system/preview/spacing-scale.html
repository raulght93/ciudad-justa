<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:24px;box-sizing:border-box;display:flex;align-items:flex-end;gap:14px}
  .unit{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--signal-red);width:34px}
  .n{font-family:var(--mono);font-size:10px;color:var(--fg-3)}
  .v{font-family:var(--mono);font-size:11px;color:var(--fg-1);font-weight:700}
</style>
</head>
<body class="cj">
  <div class="unit"><div class="bar" style="height:4px"></div><span class="v">4</span><span class="n">sp-1</span></div>
  <div class="unit"><div class="bar" style="height:8px"></div><span class="v">8</span><span class="n">sp-2</span></div>
  <div class="unit"><div class="bar" style="height:12px"></div><span class="v">12</span><span class="n">sp-3</span></div>
  <div class="unit"><div class="bar" style="height:16px"></div><span class="v">16</span><span class="n">sp-4</span></div>
  <div class="unit"><div class="bar" style="height:24px"></div><span class="v">24</span><span class="n">sp-5</span></div>
  <div class="unit"><div class="bar" style="height:32px"></div><span class="v">32</span><span class="n">sp-6</span></div>
  <div class="unit"><div class="bar" style="height:48px"></div><span class="v">48</span><span class="n">sp-7</span></div>
  <div class="unit"><div class="bar" style="height:64px"></div><span class="v">64</span><span class="n">sp-8</span></div>
  <div class="unit"><div class="bar" style="height:96px"></div><span class="v">96</span><span class="n">sp-9</span></div>
</body>
</html>
