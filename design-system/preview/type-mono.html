<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:24px;box-sizing:border-box}
  .rows{display:flex;flex-direction:column;gap:14px}
  .r{display:flex;align-items:center;gap:16px}
  .k{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--signal-yellow);background:var(--ink-800);border:1px solid var(--line);padding:5px 10px}
  .desc{font-family:var(--mono);font-size:11px;color:var(--fg-3);letter-spacing:.04em}
  .coord{font-family:var(--mono);font-size:13px;color:var(--signal-cyan)}
  .status{font-family:var(--mono);font-size:11px;color:var(--fg-2)}
</style>
</head>
<body class="cj">
  <div class="rows">
    <div class="r"><span class="k">01 ——— Las capas</span><span class="desc">índice de sección · kicker</span></div>
    <div class="r"><span class="coord">41.3851° N · 2.1734° E</span><span class="desc">coordenadas · forense</span></div>
    <div class="r"><span class="status">STATUS: CONFIRMADO · VOTOS 24 · REP 0.82</span><span class="desc">metadatos de reporte</span></div>
    <div class="r"><span class="status" style="color:var(--fg-3)">// fuente: Arrels Fundació (2026)</span><span class="desc">atribución / cita</span></div>
  </div>
</body>
</html>
