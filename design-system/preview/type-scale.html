<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:22px;box-sizing:border-box}
  .ramp{display:flex;flex-direction:column;gap:2px}
  .r{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--line-soft);padding:6px 0}
  .lab{font-family:var(--mono);font-size:10px;color:var(--fg-3);width:120px;flex:0 0 auto;letter-spacing:.06em}
  .ex{font-family:var(--display);text-transform:uppercase;color:var(--fg-1);line-height:1}
</style>
</head>
<body class="cj">
  <div class="ramp">
    <div class="r"><span class="lab">mega · 176px</span><span class="ex" style="font-size:54px">Aa</span></div>
    <div class="r"><span class="lab">h1 · 88px</span><span class="ex" style="font-size:44px">Hay sitios</span></div>
    <div class="r"><span class="lab">h2 · 54px</span><span class="ex" style="font-size:34px">Tres capas</span></div>
    <div class="r"><span class="lab">h3 · 30px · grotesk</span><span class="ex" style="font-family:var(--grotesk);font-weight:700;font-size:22px;text-transform:none">Cómo funciona</span></div>
    <div class="r"><span class="lab">lead · 21px · grotesk</span><span class="ex" style="font-family:var(--grotesk);font-weight:400;font-size:17px;text-transform:none;color:var(--fg-2)">Entradilla de sección</span></div>
  </div>
</body>
</html>
