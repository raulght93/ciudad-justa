<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:22px;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sw{border:1px solid var(--line);background:var(--ink-800);padding:14px;box-sizing:border-box}
  .dot{width:100%;height:54px;border-radius:0}
  .lbl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;margin-top:12px;color:var(--fg-1)}
  .meta{font-family:var(--mono);font-size:10px;color:var(--fg-3);margin-top:3px}
</style>
</head>
<body class="cj">
  <div class="grid">
    <div class="sw"><div class="dot" style="background:#ff3b12"></div><div class="lbl">Hostil</div><div class="meta">#FF3B12 · capa caliente</div></div>
    <div class="sw"><div class="dot" style="background:#2fe08a"></div><div class="lbl">Verde</div><div class="meta">#2FE08A · déficit</div></div>
    <div class="sw"><div class="dot" style="background:#00e5ff"></div><div class="lbl">Servicios</div><div class="meta">#00E5FF · 15-min</div></div>
    <div class="sw"><div class="dot" style="background:#b084ff"></div><div class="lbl">Vivienda</div><div class="meta">#B084FF · próx.</div></div>
  </div>
</body>
</html>
