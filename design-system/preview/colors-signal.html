<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);padding:22px;box-sizing:border-box}
  .grid{display:flex;gap:12px}
  .sw{flex:1;height:140px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;box-sizing:border-box;border:2px solid #0a0a0b}
  .role{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .name{font-family:var(--display);font-size:26px;text-transform:uppercase;line-height:.9}
  .hex{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
</style>
</head>
<body class="cj">
  <div class="grid">
    <div class="sw" style="background:#ff3b12;color:#0a0a0b"><span class="role">Brand · primary</span><div><div class="name">RED</div><span class="hex">#FF3B12</span></div></div>
    <div class="sw" style="background:#ffe000;color:#0a0a0b"><span class="role">Secondary signal</span><div><div class="name">YELLOW</div><span class="hex">#FFE000</span></div></div>
    <div class="sw" style="background:#00e5ff;color:#0a0a0b"><span class="role">Cool counter</span><div><div class="name">CYAN</div><span class="hex">#00E5FF</span></div></div>
  </div>
</body>
</html>
