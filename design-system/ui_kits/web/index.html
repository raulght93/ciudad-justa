<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciudad Justa · UI kit web (rediseño)</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--ink-900); }
  .cj-skip { position: absolute; left: -999px; top: 8px; background: var(--signal-yellow); color: #0a0a0b;
    padding: 10px 16px; font-family: var(--mono); font-weight: 700; z-index: 200; }
  .cj-skip:focus { left: 8px; }
  /* Entrada mecánica — sólo transforma; la opacidad nunca baja, así que el
     contenido es visible siempre (incluso si la animación no avanza en captura) */
  @keyframes cj-rise { from { transform: translateY(12px); } to { transform: none; } }
  .cj-reveal { animation: cj-rise 320ms cubic-bezier(0.2,0,0,1); }
  @media (prefers-reduced-motion: reduce) { .cj-reveal { animation: none; } }
  /* responsive nav */
  @media (max-width: 940px) {
    .cj-navlinks { display: none !important; }
    .cj-navburger { display: inline-flex !important; }
  }
  @media (max-width: 720px) {
    .cj-hero-grid { grid-template-columns: 1fr !important; }
    .cj-hero-grid > div { justify-content: flex-start !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="content.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
