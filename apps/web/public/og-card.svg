<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Ciudad Justa">
  <defs>
    <pattern id="saw" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0 28 L14 4 L28 28 Z" fill="none" stroke="#ff3b12" stroke-width="2"/>
    </pattern>
    <style>
      .disp { font-family: 'Anton', 'Arial Narrow', Impact, sans-serif; text-transform: uppercase; }
      .mono { font-family: 'Space Mono', ui-monospace, monospace; text-transform: uppercase; }
    </style>
  </defs>

  <!-- papel de tinta -->
  <rect width="1200" height="630" fill="#0a0a0b"/>

  <!-- pin partido por raya diagonal (rojo + eco cian) -->
  <g transform="translate(80 64) scale(0.62)">
    <path d="M24 2C11.3 2 2 11 2 23.4 2 39 24 57 24 57S46 39 46 23.4C46 11 36.7 2 24 2Z" fill="#00e5ff" transform="translate(2.6,2.2)" opacity="0.85"/>
    <path d="M24 2C11.3 2 2 11 2 23.4 2 39 24 57 24 57S46 39 46 23.4C46 11 36.7 2 24 2Z" fill="#ff3b12"/>
    <line x1="-2" y1="40" x2="50" y2="6" stroke="#0a0a0b" stroke-width="5"/>
  </g>
  <text x="124" y="96" class="mono" fill="#ffe000" font-size="22" font-weight="700" letter-spacing="4">CIUDAD JUSTA</text>
  <text x="1120" y="96" class="mono" fill="#00e5ff" font-size="20" letter-spacing="2" text-anchor="end">41.3851° N · 2.1734° E</text>

  <!-- titular cartel -->
  <text x="76" y="296" class="disp" fill="#f4f1ea" font-size="118" letter-spacing="1">HAY SITIOS DISEÑADOS</text>
  <text x="76" y="410" class="disp" font-size="118" letter-spacing="1">
    <tspan fill="#f4f1ea">PARA QUE </tspan><tspan fill="#ff3b12">NO ESTÉS.</tspan>
  </text>

  <text x="80" y="470" class="mono" fill="#b7b3a8" font-size="23" letter-spacing="1">
    ARQUITECTURA HOSTIL · DÉFICIT DE VERDE · SERVICIOS NEGADOS
  </text>

  <!-- banda de sierra (pinchos) -->
  <rect x="0" y="520" width="1200" height="28" fill="url(#saw)" opacity="0.6"/>

  <!-- leyenda de capas -->
  <g transform="translate(80 588)" class="mono" font-size="22" letter-spacing="1">
    <circle cx="9" cy="-7" r="9" fill="#ff3b12"/><text x="28" y="0" fill="#b7b3a8">HOSTIL</text>
    <circle cx="184" cy="-7" r="9" fill="#2fe08a"/><text x="203" y="0" fill="#b7b3a8">VERDE</text>
    <circle cx="349" cy="-7" r="9" fill="#00e5ff"/><text x="368" y="0" fill="#b7b3a8">SERVICIOS</text>
    <circle cx="566" cy="-7" r="9" fill="#b084ff"/><text x="585" y="0" fill="#b7b3a8">VIVIENDA · PRÓX.</text>
  </g>
</svg>
