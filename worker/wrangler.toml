# Ciudad Justa · Worker (API de la capa caliente)
# Despliegue: wrangler deploy. DB: wrangler d1 execute ciudad-justa --file=../db/schema.sql
name = "ciudad-justa-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Descomentar y rellenar database_id tras `wrangler d1 create ciudad-justa`:
# [[d1_databases]]
# binding = "DB"
# database_name = "ciudad-justa"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# R2 para fotos difuminadas (fase 1):
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "ciudad-justa-photos"
