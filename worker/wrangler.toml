# Ciudad Justa · Worker (API de la capa caliente)
# Despliegue: wrangler deploy. DB: wrangler d1 execute ciudad-justa --file=../db/schema.sql
name = "ciudad-justa-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Auth magic-link: origen del front (para construir el enlace) + remitente del email.
# El secreto RESEND_API_KEY se pone con `wrangler secret put RESEND_API_KEY`.
[vars]
APP_ORIGIN = "https://ciudad-justa.pages.dev"
MAIL_FROM = "Ciudad Justa <login@ciudad-justa.org>"

[[d1_databases]]
binding = "DB"
database_name = "ciudad-justa"
database_id = "68796e1e-33fb-42d5-8f15-7d0d23c0e018"

# R2 para fotos difuminadas (E1d). Crear el bucket antes:
#   wrangler r2 bucket create ciudad-justa-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ciudad-justa-photos"
